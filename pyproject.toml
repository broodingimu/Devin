[tool.poetry]
name = "solana-mm-bot"
version = "0.1.0"
description = "Market making bot for Solana/Raydium DEX with multi-wallet management"
authors = ["Devin <devin@example.com>"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"
solana = "^0.30.2"
solders = ">=0.18.0,<0.19.0"
pandas = "^2.2.0"
python-dotenv = "^1.0.0"
web3 = "^6.15.1"
asyncio = "^3.4.3"
aiohttp = "^3.9.1"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.1.1"
isort = "^5.13.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
